# ============================================================
# Color Complexity: Convolution vs Attention
# Diagnostic study config — LOCKED training recipe (identik antar arsitektur)
# ============================================================

seed_everything: true
seeds: [0, 1, 2, 3, 4]    # 5 seed; ini yang dipakai untuk semua angka di paper

# ---- Datasets ----
datasets:
  flowers102:
    name: flowers102
    num_classes: 102
    root: data
  cub200:
    name: cub200
    num_classes: 200
    root: data/CUB_200_2011
    # --- REVISI R1.6 (reviewer 1, poin 6) ---
    # CUB tak punya val resmi. Carve val dari TRAIN (per-kelas, seed tetap);
    # test HANYA dipakai sekali utk evaluasi akhir, TIDAK utk pilih checkpoint.
    # enabled: false -> perilaku lama (val==test) utk reproduksi baseline.
    val_split:
      enabled: true
      per_class: 5        # 5 dari ~30 img/kelas -> val ~1000, train ~4994
      split_seed: 12345   # tetap, independen dari seed model

# ---- Model zoo (via timm 1.0.27) ----
# PENTING (R1.2): bobot default timm TIDAK seragam IN1k. Data pretrain aktual
# per default-tag dicatat eksplisit di bawah (di-verifikasi 2026-07-18):
#   resnet50            -> resnet50.a1_in1k                  = IN1k  (recipe A1 "ResNet Strikes Back", ~80.4)
#   convnext_tiny       -> convnext_tiny.in12k_ft_in1k       = IN12k->1k (DATA EKSTRA, ~82.9)
#   vit_small_patch16   -> vit_small_patch16_224.augreg_in21k_ft_in1k = IN21k->1k (DATA EKSTRA, ~81.4)
#   swin_tiny           -> swin_tiny_patch4_window7_224.ms_in1k       = IN1k  (~81.2)
# 4 arm utama di bawah = "as-downloaded" (heterogen, realistis). Confound diakui + diuji.
models:
  resnet50:        { timm_name: resnet50,                    role: cnn_classic,           pretrain: in1k_a1 }
  convnext_tiny:   { timm_name: convnext_tiny,               role: cnn_modern_vit_recipe, pretrain: in12k_ft_in1k }
  vit_small:       { timm_name: vit_small_patch16_224,       role: vit_pure,              pretrain: in21k_ft_in1k }
  swin_tiny:       { timm_name: swin_tiny_patch4_window7_224, role: attention_hierarchical, pretrain: in1k_ms }

  # === REVISI (jalankan HANYA via --models eksplisit) ===
  # (a) 2x2 recipe pada sumbu ResNet (R1.1/R1.3/R1.4): tv=recipe LAMA vs a1=recipe MODERN.
  #     resnet50 (di atas) SUDAH = recipe modern (a1). tv_in1k = sel recipe LAMA yg hilang.
  resnet50_tv:         { timm_name: resnet50.tv_in1k,        role: cnn_classic_old_recipe,  pretrain: in1k_tv }   # ~76.1, ResNet klasik asli
  # (b) EQUALIZE ke IN1k (robustness R1.2): versi IN1k-only utk 2 model yg tadinya pakai data ekstra.
  #     ResNet(a1) & Swin(ms) sudah IN1k -> dipakai apa adanya di tabel equalized.
  convnext_tiny_in1k:  { timm_name: convnext_tiny.fb_in1k,   role: cnn_modern_in1k,         pretrain: in1k_fb }   # ganti in12k -> in1k
  vit_small_in1k:      { timm_name: vit_small_patch16_224.augreg_in1k, role: vit_pure_in1k,  pretrain: in1k_augreg } # ganti in21k -> in1k
  # (deprecated) resnet50_a1 = duplikat 'resnet50' (dua-duanya a1_in1k). JANGAN dipakai (no-op).
  resnet50_a1:         { timm_name: resnet50.a1_in1k,        role: DEPRECATED_duplicate_of_resnet50, pretrain: in1k_a1 }

# ---- LOCKED training recipe (jangan tuning per-model) ----
train:
  image_size: 224
  batch_size: 64
  grad_accum_steps: 1        # naikkan + turunkan batch kalau OOM, jaga effective batch = 64
  epochs: 60
  warmup_epochs: 5
  optimizer: adamw           # default arm (jangan diubah). Override via recipes: di bawah.
  lr: 1.0e-4
  weight_decay: 0.05
  scheduler: cosine
  label_smoothing: 0.1
  amp: true
  num_workers: 2        # diturunkan dari 4 (2026-07-18): cegah Windows shared-mem/paging exhaustion (err 1455) di run panjang
  # train transform: RandomResizedCrop scale=(0.6,1.0) + HFlip ONLY. NO color aug.
  rrc_scale: [0.6, 1.0]

# ---- Recipe packs (ablation A: optimizer-only change, semua lain identik) ----
# Hanya optimizer+lr+weight_decay yang beda. lr literatur, TIDAK di-tune.
recipes:
  adamw:                     # arm lama (default proyek, lr standar ViT/timm)
    optimizer: adamw
    lr: 1.0e-4
    weight_decay: 0.05
  sgd:                       # arm ablation (lr standar ResNet buku-teks)
    optimizer: sgd
    lr: 0.01
    weight_decay: 1.0e-4
    momentum: 0.9
    nesterov: true
    lr_fallback: 0.005       # pengaman numerik kalau divergen di iterasi awal (BUKAN tuning)
  # --- ResNet-proper (arm ROBUSTNESS R1.4/R1.5): LR wajar utk ResNet ---
  # Shared 1e-4 (LR khas ViT) under-tune ResNet. 1e-3 = LR fine-tune wajar ResNet.
  # Diagnosis 1-seed: Flowers 0.847->0.900, CUB 0.790->0.822 (gap tetap, ranking robust).
  # wd=0.05 (sama shared) -> ISOLASI efek LR. Arm=resnet50_adamw_lr1e3.
  adamw_lr1e3:
    optimizer: adamw
    lr: 1.0e-3
    weight_decay: 0.05
  # --- CONTINGENCY: LR sensitivity sweep buat ViT/Swin (revisi reviewer saja) ---
  # Nutup objection "attention models under-tuned at lr 1e-4". Cuma lr yang beda.
  adamw_lr5e5:
    optimizer: adamw
    lr: 5.0e-5
    weight_decay: 0.05
  adamw_lr3e4:
    optimizer: adamw
    lr: 3.0e-4
    weight_decay: 0.05

eval:
  resize: 256
  center_crop: 224
  batch_size: 128

# ---- Colorfulness (Hasler-Susstrunk) stratifikasi ----
colorfulness:
  tertile_low: 0.333
  tertile_high: 0.667

# ---- E2 perturbations (test-time only) ----
perturb:
  hue_factors: [-0.5, -0.25, -0.083, 0.083, 0.25, 0.5]
  quant_levels: [2, 4, 8, 16]
  # channel shuffle: semua 5 permutasi RGB non-identitas, dirata-rata

# ---- Paths ----
paths:
  checkpoints: checkpoints
  results: results
  tables: tables
  figures: figures
  logs: logs
